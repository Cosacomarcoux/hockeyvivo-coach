<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HockeyVivo Coach</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
/* ═══ RESET ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0A0A0A;color:#F5F5F5;font-family:'Barlow',sans-serif;min-height:100vh;min-height:100dvh;overflow:hidden}
button{background:transparent;border:0;cursor:pointer;font-family:inherit;color:inherit;padding:0}
input,select{font-family:inherit}

/* ═══ TYPOGRAPHY ═══ */
.label{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-weight:500}
.num{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.01em;line-height:.9}
.muted{color:#6B6B6B}
.accent{color:#E63946}

/* ═══ SCREENS ═══ */
.screen{display:none;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;background:#0A0A0A;z-index:1}
.screen.active{display:flex}

/* ═══ SCREEN HEADER ═══ */
.screen-header{display:flex;align-items:flex-end;justify-content:space-between;padding:48px 20px 16px;flex-shrink:0}
.screen-header h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.02em;line-height:.9}
.screen-header .subtitle{font-family:'Barlow Condensed',sans-serif;color:#6B6B6B;text-transform:uppercase;letter-spacing:.16em;font-size:11px;margin-top:4px}

/* ═══ SCROLL ═══ */
.scroll-content{flex:1;overflow-y:auto;padding:0 20px 100px;-webkit-overflow-scrolling:touch}
.scroll-content::-webkit-scrollbar{display:none}
.scroll-content{scrollbar-width:none}

/* ═══ TAB BAR ═══ */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:72px;background:#0A0A0A;border-top:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0);z-index:50}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:#6B6B6B;padding:8px 16px}
.tab-btn.active{color:#F5F5F5}
.tab-btn svg{width:22px;height:22px}
.tab-dot{width:3px;height:3px;background:#E63946;border-radius:50%;opacity:0}
.tab-btn.active .tab-dot{opacity:1}

/* ═══ BUTTONS ═══ */
.btn-primary{background:#E63946;color:#0A0A0A;font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:14px;padding:14px 24px;border-radius:8px;width:100%;text-align:center}
.btn-primary:active{background:#FF4D5E;transform:scale(.98)}
.btn-ghost{background:transparent;border:1px solid #262626;color:#F5F5F5;font-family:'Barlow Condensed',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.12em;font-size:13px;padding:12px 20px;border-radius:8px;width:100%;text-align:center}
.btn-ghost:active{background:#1a1a1a}
.btn-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#E63946;color:#0A0A0A;flex-shrink:0}

/* ═══ INPUTS ═══ */
.input-group{margin-bottom:16px}
.input-group label{display:block;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:#6B6B6B;margin-bottom:6px}
.input-group input,.input-group select{width:100%;background:#111;border:1px solid #262626;color:#F5F5F5;padding:12px 14px;border-radius:8px;font-size:15px;outline:none}
.input-group input:focus,.input-group select:focus{border-color:#E63946}
.input-group select{appearance:none}

/* ═══ COLOR PICKER ═══ */
.color-options{display:flex;gap:10px;flex-wrap:wrap}
.color-dot{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.color-dot.selected{border-color:#F5F5F5;box-shadow:0 0 0 2px #E63946}

/* ═══ CHIP SELECTOR ═══ */
.chip-group{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:20px;border:1px solid #333;background:transparent;color:#aaa;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:all .15s}
.chip.selected{background:#E63946;border-color:#E63946;color:#fff}

/* ═══ METRIC CARDS ═══ */
.metric-section{margin-bottom:16px}
.metric-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:#6B6B6B;margin-bottom:8px}
.metric-card{background:#111;border:1px solid #1a1a1a;border-radius:10px;padding:14px;margin-bottom:8px}
.metric-row{display:flex;justify-content:space-between;align-items:center}
.metric-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#aaa}
.metric-value{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#F5F5F5}
.metric-value.accent{color:#E63946}
.metric-value.gold{color:#FFD600}
.metric-value.green{color:#2A9D8F}
.metric-bar-bg{height:6px;background:#1a1a1a;border-radius:3px;margin-top:6px;overflow:hidden}
.metric-bar{height:100%;border-radius:3px;transition:width .3s}
.metric-note{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#555;margin-top:4px}
.metric-warn{color:#E63946}

/* ═══ AVATAR ═══ */
.avatar{width:40px;height:40px;border-radius:50%;background:#1f1f1f;color:#E63946;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar-lg{width:64px;height:64px;font-size:24px}

/* ═══ BACK BUTTON ═══ */
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#6B6B6B;padding:8px 0}
.back-btn:active{color:#F5F5F5}

/* ═══ EMPTY STATE ═══ */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 20px;text-align:center}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-state h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:18px;margin-bottom:8px}
.empty-state p{color:#6B6B6B;font-size:14px;max-width:260px}

/* ═══ TEAM CARD ═══ */
.team-card{display:flex;align-items:center;gap:14px;padding:16px;background:#111;border:1px solid #1a1a1a;border-radius:12px;margin-bottom:10px;cursor:pointer}
.team-card:active{background:#1a1a1a}
.team-color{width:6px;align-self:stretch;border-radius:3px;flex-shrink:0}
.team-info{flex:1}
.team-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.team-chips{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.team-chip{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:10px;border:1px solid #333;color:#aaa;line-height:1.4}
.team-meta{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#6B6B6B;text-transform:uppercase;letter-spacing:.1em;margin-top:5px;display:flex;gap:12px}
.team-arrow{color:#6B6B6B;font-size:18px;align-self:center}

/* ═══ PLAYER ROW ═══ */
.player-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1a1a1a;cursor:pointer}
.player-row:active{opacity:.7}
.player-info{flex:1;min-width:0}
.player-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.04em}
.player-meta{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#6B6B6B;text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
.player-number{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#6B6B6B;min-width:28px;text-align:center}

/* ═══ TEST CARD ═══ */
.test-card{display:flex;align-items:center;gap:14px;padding:16px;background:#111;border:1px solid #1a1a1a;border-radius:12px;margin-bottom:10px;cursor:pointer}
.test-card:active{background:#1a1a1a}
.test-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#1a1a1a;border-radius:10px}
.test-info{flex:1}
.test-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.test-desc{font-size:12px;color:#6B6B6B;margin-top:2px}

/* ═══ HISTORY ROW ═══ */
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a}
.hist-date{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#6B6B6B;text-transform:uppercase;letter-spacing:.08em}
.hist-value{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#FFD600}
.hist-test{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#6B6B6B;text-transform:uppercase;letter-spacing:.1em}
.hist-expandable{cursor:pointer}
.hist-expandable:active{background:#1a1a1a}
.eval-detail{padding:0 4px;border-bottom:1px solid #1a1a1a}

/* ═══ SPARK CHART ═══ */
.spark-container{background:#111;border:1px solid #1a1a1a;border-radius:10px;padding:16px;margin-top:12px}
.spark-container canvas{width:100%;height:120px}

/* ═══ PROFILE HEADER ═══ */
.profile-header{display:flex;align-items:center;gap:14px;padding:16px 0}
.profile-header img{width:56px;height:56px;border-radius:50%;object-fit:cover}

/* ═══ LOGIN ═══ */
#screen-login{align-items:center;justify-content:center;gap:24px;padding:40px}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:.04em;text-align:center;line-height:1}
.login-badge{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.3em;color:#E63946;text-align:center;margin-top:-8px}
.login-sub{font-family:'Barlow Condensed',sans-serif;color:#6B6B6B;text-transform:uppercase;letter-spacing:.16em;font-size:12px;text-align:center}

/* ═══ CHALLENGE SCREEN ═══ */
#screen-challenge{background:#000}
#screen-challenge video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.canvas-overlay{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.challenge-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;z-index:10;pointer-events:none}
.challenge-hud>*{pointer-events:all}
.hud-counter{font-family:'Bebas Neue',sans-serif;font-size:72px;color:#FFD600;text-shadow:0 2px 8px rgba(0,0,0,.8);line-height:1}
.hud-timer{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#F5F5F5;text-shadow:0 2px 8px rgba(0,0,0,.8);line-height:1}
.hud-timer.warning{color:#FF6B00}
.hud-timer.urgent{color:#E63946}
.status-bar{position:absolute;bottom:16px;left:16px;right:16px;background:rgba(0,0,0,.7);color:#F5F5F5;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.06em;padding:10px 16px;border-radius:8px;text-align:center;z-index:10}
.status-bar.detected{border:1px solid rgba(57,255,20,.3)}
.challenge-btn{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:10;background:#E63946;color:#0A0A0A;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:18px;padding:14px 32px;border-radius:10px}
.challenge-btn:active{background:#FF4D5E}
#btn-skip-calib{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.6);color:#6B6B6B;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:6px;border:1px solid #333}
#btn-remark-cones{position:absolute;top:12px;right:12px;z-index:10;background:rgba(0,0,0,.6);color:#FF9A00;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:6px;border:1px solid #333}
#btn-back-challenge{position:absolute;top:12px;left:12px;z-index:10;background:rgba(0,0,0,.6);color:#F5F5F5;font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.countdown-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20}
.countdown-num{font-family:'Bebas Neue',sans-serif;font-size:120px;color:#FFD600;animation:countPop .8s ease-out}
@keyframes countPop{0%{transform:scale(2);opacity:0}50%{transform:scale(1);opacity:1}100%{opacity:1}}

/* ═══ ROTATE OVERLAY ═══ */
.rotate-overlay{display:none;position:fixed;inset:0;background:#0A0A0A;z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#F5F5F5;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:14px}
.rotate-icon{font-size:48px;animation:rwiggle 2s ease-in-out infinite}
@keyframes rwiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(15deg)}75%{transform:rotate(-15deg)}}

/* ═══ RESULT ═══ */
.result-big{font-family:'Bebas Neue',sans-serif;font-size:96px;color:#FFD600;line-height:1;text-align:center}
.correction-btns{display:flex;align-items:center;justify-content:center;gap:24px;margin:20px 0}
.correction-btn{width:56px;height:56px;border-radius:50%;background:#1a1a1a;border:1px solid #333;color:#F5F5F5;font-family:'Bebas Neue',sans-serif;font-size:28px;display:flex;align-items:center;justify-content:center}
.correction-btn:active{background:#262626}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid #333;color:#F5F5F5;font-family:'Barlow Condensed',sans-serif;font-size:13px;padding:10px 20px;border-radius:8px;z-index:200;display:none;white-space:nowrap}
.toast.show{display:block;animation:toastin .3s ease}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(10px)}}

/* ═══ SPINNER ═══ */
.spinner{width:24px;height:24px;border:2px solid #333;border-top-color:#E63946;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

.divider{height:1px;background:#1a1a1a;margin:12px 0}
</style>
</head>
<body>

<!-- ═══════════════════════════ LOGIN ═══════════════════════════ -->
<div id="screen-login" class="screen active">
  <div class="login-logo">HOCKEY<span class="accent">VIVO</span></div>
  <div class="login-badge">COACH</div>
  <p class="login-sub">Evalua a tus jugadoras con IA</p>
  <button onclick="loginWithGoogle()" class="btn-primary" style="max-width:300px">INICIAR CON GOOGLE</button>
  <div id="login-spinner" class="spinner" style="display:none"></div>
  <p id="login-error" style="color:#E63946;font-size:13px;display:none"></p>
</div>

<!-- ═══════════════════════ ONBOARDING ═════════════════════════ -->
<div id="screen-onboarding" class="screen">
  <div style="padding:60px 24px 40px;overflow-y:auto;flex:1">
    <h1 class="num" style="font-size:36px">BIENVENIDO</h1>
    <p id="onb-name" class="muted" style="margin-top:8px"></p>
    <div class="input-group" style="margin-top:32px">
      <label>NOMBRE DEL CLUB</label>
      <input id="onb-club" type="text" placeholder="Ej: Club Atletico San Isidro">
    </div>
    <button onclick="saveOnboarding()" class="btn-primary" style="margin-top:16px">CONTINUAR</button>
  </div>
</div>

<!-- ═══════════════════════ TEAMS ══════════════════════════════ -->
<div id="screen-teams" class="screen">
  <div class="screen-header">
    <div>
      <h1>EQUIPOS</h1>
      <div class="subtitle" id="teams-club"></div>
    </div>
    <button class="btn-icon" onclick="goTo('screen-create-team')" aria-label="Crear equipo">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="10" y1="3" x2="10" y2="17"/><line x1="3" y1="10" x2="17" y2="10"/></svg>
    </button>
  </div>
  <div id="teams-list" class="scroll-content"></div>
</div>

<!-- ═══════════════════ CREATE TEAM ════════════════════════════ -->
<div id="screen-create-team" class="screen">
  <div style="padding:48px 20px 40px;overflow-y:auto;flex:1">
    <button class="back-btn" onclick="goTo('screen-teams')">&#8592; EQUIPOS</button>
    <h1 class="num" style="font-size:32px;margin-top:12px">NUEVO EQUIPO</h1>
    <div class="input-group" style="margin-top:24px">
      <label>NOMBRE</label>
      <input id="ct-nombre" type="text" placeholder="Ej: Sub-14 Femenino">
    </div>
    <div class="input-group">
      <label>CATEGORÍA</label>
      <div id="ct-categoria" class="chip-group"></div>
    </div>
    <div class="input-group">
      <label>GÉNERO</label>
      <div id="ct-genero" class="chip-group"></div>
    </div>
    <div class="input-group">
      <label>COLOR</label>
      <div id="ct-colors" class="color-options"></div>
    </div>
    <button id="ct-submit" onclick="createTeam()" class="btn-primary" style="margin-top:24px">CREAR EQUIPO</button>
    <p id="ct-error" style="color:#E63946;font-size:13px;margin-top:8px;display:none"></p>
  </div>
</div>

<!-- ═══════════════════════ ROSTER ═════════════════════════════ -->
<div id="screen-roster" class="screen">
  <div class="screen-header">
    <div>
      <button class="back-btn" onclick="goTo('screen-teams')">&#8592; EQUIPOS</button>
      <h1 id="roster-team-name"></h1>
    </div>
    <button class="btn-icon" onclick="goTo('screen-add-player')" aria-label="Agregar jugadora">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="10" y1="3" x2="10" y2="17"/><line x1="3" y1="10" x2="17" y2="10"/></svg>
    </button>
  </div>
  <div id="roster-list" class="scroll-content"></div>
</div>

<!-- ═══════════════════ ADD PLAYER ═════════════════════════════ -->
<div id="screen-add-player" class="screen">
  <div style="padding:48px 20px 40px;overflow-y:auto;flex:1">
    <button class="back-btn" onclick="goTo('screen-roster')">&#8592; PLANTEL</button>
    <h1 class="num" style="font-size:32px;margin-top:12px">NUEVA JUGADORA</h1>
    <div class="input-group" style="margin-top:24px">
      <label>NOMBRE</label>
      <input id="ap-nombre" type="text" placeholder="Maria">
    </div>
    <div class="input-group">
      <label>APELLIDO</label>
      <input id="ap-apellido" type="text" placeholder="Gonzalez">
    </div>
    <div class="input-group">
      <label>FECHA DE NACIMIENTO</label>
      <input id="ap-dob" type="date">
    </div>
    <div style="display:flex;gap:12px">
      <div class="input-group" style="flex:1">
        <label>POSICION</label>
        <select id="ap-pos">
          <option value="">--</option>
          <option value="ARQ">ARQ</option>
          <option value="DEF">DEF</option>
          <option value="MED">MED</option>
          <option value="DEL">DEL</option>
        </select>
      </div>
      <div class="input-group" style="flex:1">
        <label>NUMERO</label>
        <input id="ap-num" type="number" min="1" max="99" placeholder="#">
      </div>
    </div>
    <button onclick="addPlayer()" class="btn-primary" style="margin-top:24px">AGREGAR</button>
    <p id="ap-error" style="color:#E63946;font-size:13px;margin-top:8px;display:none"></p>
  </div>
</div>

<!-- ═══════════════════ PLAYER PROFILE ═════════════════════════ -->
<div id="screen-player" class="screen">
  <div style="padding:48px 20px 0;flex-shrink:0">
    <button class="back-btn" onclick="goTo('screen-roster')">&#8592; PLANTEL</button>
  </div>
  <div class="scroll-content" style="padding-top:8px">

function showToast(msg, ms) {
  ms = ms || 2500;
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(function() { t.className = 'toast'; }, ms);
}

function formatDate(iso) {
  if (!iso) return '\u2014';
  return new Date(iso).toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function calcAge(dob) {
  if (!dob) return '';
  var d = new Date(dob), now = new Date();
  var age = now.getFullYear() - d.getFullYear();
  if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) age--;
  return age;
}

function initials(nombre, apellido) {
  return ((nombre || '')[0] || '').toUpperCase() + ((apellido || '')[0] || '').toUpperCase();
}

function escHtml(s) {
  var d = document.createElement('div'); d.textContent = s; return d.innerHTML;

  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });

  if (el) el.classList.add('active');

  var tabBar = document.getElementById('tab-bar');
  tabBar.style.display = TAB_SCREENS.indexOf(id) >= 0 ? 'flex' : 'none';

  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  if (id === 'screen-teams') document.getElementById('tab-teams').classList.add('active');
  if (id === 'screen-settings') document.getElementById('tab-settings').classList.add('active');

}

async function initApp() {
  if (!window.supabase) {
    document.getElementById('login-error').textContent = 'Error: Supabase no cargo';
    document.getElementById('login-error').style.display = 'block';
    return;
  }

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storage: window.localStorage
    }
  });

  var sess = await sb.auth.getSession();
  if (sess.data.session) {
    currentUser = sess.data.session.user;
    await handleAuth();
  }

  sb.auth.onAuthStateChange(async function(event, session) {
    if (event === 'SIGNED_IN' && session) {
      currentUser = session.user;
      await handleAuth();
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      coachProfile = null;
      stopCameraIfRunning();
      goTo('screen-login');
    }
  });
}

async function loginWithGoogle() {
  document.getElementById('login-spinner').style.display = 'block';
  document.getElementById('login-error').style.display = 'none';
  var res = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (res.error) {
    document.getElementById('login-spinner').style.display = 'none';
    document.getElementById('login-error').textContent = res.error.message;
    document.getElementById('login-error').style.display = 'block';
  }
}

async function handleAuth() {
  if (!currentUser) return;

  // 1. Check/create usuario — if exists, DON'T touch it
  var uRes = await sb.from('usuarios').select('id').eq('id', currentUser.id).maybeSingle();
  if (!uRes.data) {
    var meta = currentUser.user_metadata || {};
    var fullName = (meta.full_name || meta.name || '').trim();
    var parts = fullName.split(/\s+/);
    await sb.from('usuarios').insert({
      id: currentUser.id,
      nombre: parts[0] || '',
      apellido: parts.slice(1).join(' ') || '',
      email: currentUser.email,
      foto_url: meta.avatar_url || null
    });
  }

  // 2. Check/load coach
  var cRes = await sb.from('coaches').select('*').eq('id', currentUser.id).maybeSingle();
  if (!cRes.data) {
    var meta2 = currentUser.user_metadata || {};
    document.getElementById('onb-name').textContent = meta2.full_name || meta2.name || currentUser.email;
    goTo('screen-onboarding');
    return;
  }

  coachProfile = cRes.data;
  goTo('screen-teams');
}

async function saveOnboarding() {
  var club = document.getElementById('onb-club').value.trim();
  if (!club) { showToast('Ingresa el nombre del club'); return; }

  var res = await sb.from('coaches').insert({ id: currentUser.id, club_texto: club }).select().single();
  if (res.error) { showToast('Error: ' + res.error.message); return; }
  coachProfile = res.data;
  goTo('screen-teams');
}

function stopCameraIfRunning() {

}

var teamStats = {}; // { teamId: { playerCount, lastEval } }

async function loadTeams() {
  document.getElementById('teams-club').textContent = coachProfile ? coachProfile.club_texto || '' : '';
  var res = await sb.from('equipos').select('*').order('creado_en', { ascending: false });
  if (res.error) { showToast('Error cargando equipos'); return; }
  teams = res.data || [];

  // Fetch player counts and last evaluation per team in parallel
  teamStats = {};
  if (teams.length) {
    var ids = teams.map(function(t) { return t.id; });
    var pRes = await sb.from('plantel_coach').select('equipo_id').in('equipo_id', ids).is('fecha_baja', null);
    var eRes = await sb.from('evaluaciones').select('equipo_id, fecha').in('equipo_id', ids).order('fecha', { ascending: false });
    var plantel = pRes.data || [];
    var evals = eRes.data || [];
    ids.forEach(function(id) {
      teamStats[id] = {
        playerCount: plantel.filter(function(p) { return p.equipo_id === id; }).length,
        lastEval: null
      };
    });
    evals.forEach(function(ev) {
      if (ev.equipo_id && teamStats[ev.equipo_id] && !teamStats[ev.equipo_id].lastEval) {
        teamStats[ev.equipo_id].lastEval = ev.fecha;
      }
    });
  }
  renderTeams();
}

function categLabel(cat) {
  if (cat === 'OPN') return 'PRIMERA';
  return cat || '';
}
function generoLabel(g) {
  if (!g) return '';

}

function renderTeams() {

  el.innerHTML = teams.map(function(t) {
    var st = teamStats[t.id] || { playerCount: 0, lastEval: null };
    var chips = '';
    if (t.categoria) chips += '<span class="team-chip">' + categLabel(t.categoria) + '</span>';
    if (t.genero) chips += '<span class="team-chip">' + generoLabel(t.genero) + '</span>';
    var evalText = st.lastEval ? formatDate(st.lastEval) : 'Sin evaluaciones';
    return '<div class="team-card" onclick="openTeam(\'' + t.id + '\')">' +
      '<div class="team-color" style="background:' + escHtml(t.color || '#E63946') + '"></div>' +
      '<div class="team-info"><div class="team-name">' + escHtml(t.nombre || 'Sin nombre') + '</div>' +
      (chips ? '<div class="team-chips">' + chips + '</div>' : '') +
      '<div class="team-meta"><span>' + st.playerCount + ' jugadora' + (st.playerCount !== 1 ? 's' : '') + '</span>' +
      '<span>\u00B7 ' + evalText + '</span></div></div>' +
      '<div class="team-arrow">\u203A</div></div>';
  }).join('');
}

function drawSparkChart(evals) {
  var canvas = document.getElementById('spark-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  var data = evals.slice().reverse();
  if (data.length < 2) return;
  var values = data.map(function(e) { return e.resultado_principal; });
  var maxVal = Math.max.apply(null, values), minVal = Math.min.apply(null, values);
  var range = (maxVal - minVal) || 1;
  var pX = 20, pY = 20, pW = W - 40, pH = H - 40;

  // Fill
  ctx.beginPath();
  data.forEach(function(e, i) {
    var x = pX + (i / (data.length - 1)) * pW;
    var y = pY + pH - ((e.resultado_principal - minVal) / range) * pH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(pX + pW, pY + pH);
  ctx.lineTo(pX, pY + pH);
  ctx.closePath();
  var grad = ctx.createLinearGradient(0, pY, 0, pY + pH);
  grad.addColorStop(0, 'rgba(230,57,70,0.25)');
  grad.addColorStop(1, 'rgba(230,57,70,0)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  data.forEach(function(e, i) {
    var x = pX + (i / (data.length - 1)) * pW;
    var y = pY + pH - ((e.resultado_principal - minVal) / range) * pH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#E63946';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Dots
  data.forEach(function(e, i) {
    var x = pX + (i / (data.length - 1)) * pW;
    var y = pY + pH - ((e.resultado_principal - minVal) / range) * pH;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#E63946';
    ctx.fill();
    ctx.strokeStyle = '#0A0A0A';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
}

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playBeep(freq, duration, type, gain) {
  freq = freq || 440; duration = duration || 0.12; type = type || 'sine'; gain = gain || 0.4;
  try {
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var vol = ctx.createGain();
    osc.connect(vol); vol.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    vol.gain.setValueAtTime(gain, ctx.currentTime);
    vol.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function trackerUpdate(detected) {
  if (detected) {
    lostFrames = 0;
    if (!trackedBall) {
      trackedBall = { x: detected.x, y: detected.y };
    } else {
      trackedBall.x = 0.85 * detected.x + 0.15 * trackedBall.x;
      trackedBall.y = 0.85 * detected.y + 0.15 * trackedBall.y;
    }
    return { x: trackedBall.x, y: trackedBall.y };
  }
  lostFrames++;
  return null;
}

// ═══════════════════════════════════════════════════════════════
//  EIGHT DETECTION STATE MACHINE
// ═══════════════════════════════════════════════════════════════
function resetEightState() {
  pathPoints = []; eightState = 0; firstConeVisited = null;
  centerCrossings = 0; lastCenterSide = null; stateStartTime = 0;
  lastBallMoveTime = 0; verticalRangeInState = { minY: Infinity, maxY: -Infinity };
}

function detectEight(newPos) {
  if (!newPos || !coneA || !coneB || !conesMarked) return;

  pathPoints.push({ x: newPos.x, y: newPos.y, t: Date.now() });
  if (pathPoints.length > PATH_MAX) pathPoints.shift();

  var leftCone = coneA.x <= coneB.x ? coneA : coneB;
  var rightCone = coneA.x <= coneB.x ? coneB : coneA;
  var midX = (leftCone.x + rightCone.x) / 2;
  var centerBand = Math.abs(rightCone.x - leftCone.x) * 0.20;

  var currentSide = newPos.x < midX - centerBand ? 'left'
                  : newPos.x > midX + centerBand ? 'right' : 'center';

  var justCrossed = false;
  if (lastCenterSide && currentSide !== 'center' && lastCenterSide !== currentSide && lastCenterSide !== 'center') {
    justCrossed = true; centerCrossings++;
    if (challengeActive) crucesTimestamps.push({ t: +((Date.now() - challengeStartMs) / 1000).toFixed(1), side: currentSide });
  }
  if (currentSide !== 'center') lastCenterSide = currentSide;

  verticalRangeInState.minY = Math.min(verticalRangeInState.minY, newPos.y);
  verticalRangeInState.maxY = Math.max(verticalRangeInState.maxY, newPos.y);

  var outsideLeft = newPos.x < leftCone.x;
  var outsideRight = newPos.x > rightCone.x;
  var separacion = Math.abs(rightCone.x - leftCone.x);
  var minMovVertical = separacion * 0.20;
  var aIsLeft = coneA.x <= coneB.x;
  var outsideA = aIsLeft ? outsideLeft : outsideRight;
  var outsideB = aIsLeft ? outsideRight : outsideLeft;
  var now = Date.now();

  if (pathPoints.length >= 2) {
    var prev = pathPoints[pathPoints.length - 2];
    var dx = newPos.x - prev.x, dy = newPos.y - prev.y;
    if (Math.sqrt(dx*dx + dy*dy) > 8) lastBallMoveTime = now;
  } else { lastBallMoveTime = now; }

  if (eightState > 0 && lastBallMoveTime > 0 && now - lastBallMoveTime > STATE_TIMEOUT) {
    eightState = 0; firstConeVisited = null; centerCrossings = 0;
    verticalRangeInState = { minY: Infinity, maxY: -Infinity };
  }

  switch (eightState) {
    case 0:
      if (outsideA) { eightState = 1; firstConeVisited = 'A'; stateStartTime = now; centerCrossings = 0; }
      else if (outsideB) { eightState = 1; firstConeVisited = 'B'; stateStartTime = now; centerCrossings = 0; }
      break;
    case 1:
      if (justCrossed) eightState = 2;
      break;
    case 2:
      if (firstConeVisited === 'A' && outsideB) eightState = 3;
      else if (firstConeVisited === 'B' && outsideA) eightState = 3;
      else if ((firstConeVisited === 'A' && outsideA) || (firstConeVisited === 'B' && outsideB)) {
        eightState = 1; centerCrossings = 1;
      }
      break;
    case 3:
      if (justCrossed) {
        var rangoV = verticalRangeInState.maxY - verticalRangeInState.minY;
        if (rangoV >= minMovVertical && now - lastEightTime > eightCooldown) {
          lastEightTime = now;
          registerEight();
        }
        eightState = 0; firstConeVisited = null; centerCrossings = 0;
        verticalRangeInState = { minY: Infinity, maxY: -Infinity };
      }
      break;
  }
}

function registerEight() {
  if (!challengeActive) return;
  eightCount++;
  ochosTimestamps.push(+((Date.now() - challengeStartMs) / 1000).toFixed(1));
  playEightSound();
  document.getElementById('hud-counter').textContent = eightCount;
  var statusEl = document.getElementById('status-bar');
  statusEl.textContent = '\u2705 \u00A1OCHO #' + eightCount + ' detectado!';
  statusEl.className = 'status-bar detected';
  setTimeout(function() {
    if (challengeActive) {
      statusEl.textContent = '\uD83C\uDFD1 Segui haciendo ochos...';
      statusEl.className = 'status-bar detected';
    }
  }, 800);
}

// ═══════════════════════════════════════════════════════════════
//  CONE DRAWING
// ═══════════════════════════════════════════════════════════════
function drawCones(W, H) {
  if (!overlayCtx || !W || !H) return;
  var cones = [];
  if (coneA) cones.push({ x: coneA.x, y: coneA.y, label: 'A' });
  if (coneB) cones.push({ x: coneB.x, y: coneB.y, label: 'B' });

  cones.forEach(function(c) {
    overlayCtx.save();
    overlayCtx.beginPath();
    overlayCtx.arc(c.x, c.y, 11, 0, Math.PI * 2);
    overlayCtx.strokeStyle = '#FF6B00';
    overlayCtx.lineWidth = 2.5;
    overlayCtx.stroke();
    overlayCtx.beginPath();
    overlayCtx.arc(c.x, c.y, 3, 0, Math.PI * 2);
    overlayCtx.fillStyle = '#FF6B00';
    overlayCtx.fill();
    overlayCtx.font = 'bold 12px sans-serif';
    overlayCtx.fillStyle = '#FF9A00';
    overlayCtx.textAlign = 'center';
    overlayCtx.fillText(c.label, c.x, c.y - 16);
    overlayCtx.restore();
  });

  if (coneA && coneB) {
    var rX = Math.abs(coneB.x - coneA.x) / 2.2;
    var rY = H * 0.15;
    overlayCtx.save();
    overlayCtx.globalAlpha = 0.18;
    overlayCtx.strokeStyle = '#39FF14';
    overlayCtx.lineWidth = 2;
    overlayCtx.setLineDash([8, 6]);
    overlayCtx.beginPath();
    overlayCtx.ellipse(coneA.x, coneA.y - 20, rX, rY, 0, 0, Math.PI * 2);
    overlayCtx.stroke();
    overlayCtx.beginPath();
    overlayCtx.ellipse(coneB.x, coneB.y - 20, rX, rY, 0, 0, Math.PI * 2);
    overlayCtx.stroke();
    overlayCtx.setLineDash([]);
    overlayCtx.restore();
  }

  if (challengeActive && coneA && coneB) {
    var showA = (firstConeVisited === 'A' && eightState >= 1) || (firstConeVisited === 'B' && eightState >= 3);
    var showB = (firstConeVisited === 'B' && eightState >= 1) || (firstConeVisited === 'A' && eightState >= 3);
    [[showA, coneA, -30], [showB, coneB, 30]].forEach(function(arr) {
      if (!arr[0]) return;
      overlayCtx.save();
      overlayCtx.fillStyle = '#39FF14';
      overlayCtx.beginPath();
      overlayCtx.arc(arr[1].x + arr[2], arr[1].y - 25, 9, 0, Math.PI * 2);
      overlayCtx.fill();
      overlayCtx.strokeStyle = '#000';
      overlayCtx.lineWidth = 2;
      overlayCtx.stroke();
      overlayCtx.restore();
    });
  }
}

// ═══════════════════════════════════════════════════════════════
//  CONE MARKING + BALL CALIBRATION
// ═══════════════════════════════════════════════════════════════
function screenToVideoCoords(clientX, clientY) {
  var rect = overlayCanvas.getBoundingClientRect();
  var dispW = rect.width, dispH = rect.height;
  var vidW = (videoEl && videoEl.videoWidth) || overlayCanvas.width;
  var vidH = (videoEl && videoEl.videoHeight) || overlayCanvas.height;
  var scale = Math.max(dispW / vidW, dispH / vidH);
  var offsetX = (vidW * scale - dispW) / 2;
  var offsetY = (vidH * scale - dispH) / 2;
  return { x: (clientX - rect.left + offsetX) / scale, y: (clientY - rect.top + offsetY) / scale };
}

function startConeMarking() {
  coneA = null; coneB = null; conesMarked = false; coneMarkingStep = 0;
  document.getElementById('btn-start-challenge').style.display = 'none';
  document.getElementById('btn-remark-cones').style.display = 'none';
  document.getElementById('status-bar').textContent = '\uD83D\uDC46 Toca el primer cono (A)';
  document.getElementById('status-bar').className = 'status-bar';
  var canvas = document.getElementById('canvas-overlay');
  canvas.style.pointerEvents = 'all';
  canvas.ontouchstart = handleConeTap;
  canvas.onclick = handleConeTap;
}

function handleConeTap(e) {
  e.preventDefault();
  if (conesMarked || !videoEl || !overlayCanvas) return;
  var touch = e.touches ? e.touches[0] : e;
  var pos = screenToVideoCoords(touch.clientX, touch.clientY);
  if (coneMarkingStep === 0) {
    coneA = pos; coneMarkingStep = 1;
    document.getElementById('status-bar').textContent = '\uD83D\uDC46 Ahora toca el segundo cono (B)';
    playBeep(660, 0.1, 'sine', 0.3);
  } else if (coneMarkingStep === 1) {
    coneB = pos; coneMarkingStep = 2; conesMarked = true;
    document.getElementById('btn-remark-cones').style.display = 'block';
    playBeep(880, 0.12, 'sine', 0.3);
    document.getElementById('canvas-overlay').style.pointerEvents = 'none';
    iniciarCalibracionBocha();
  }
}

function iniciarCalibracionBocha() {
  window._calibBocha = { activa: true, hecha: false, muestras: [], inicio: Date.now() };
  document.getElementById('btn-skip-calib').style.display = 'block';
  document.getElementById('btn-start-challenge').style.display = 'none';
  document.getElementById('status-bar').textContent = '\uD83C\uDFAF Pone la bocha quieta dentro del circulo amarillo';
  document.getElementById('status-bar').className = 'status-bar';
}

function finCalibracionBocha(ok) {
  window._calibBocha.activa = false;
  window._calibBocha.hecha = ok;
  document.getElementById('btn-skip-calib').style.display = 'none';
  document.getElementById('btn-start-challenge').style.display = 'block';
  var statusEl = document.getElementById('status-bar');
  statusEl.textContent = ok ? '\u2705 Bocha calibrada \u2014 presiona COMENZAR' : '\u2705 Todo listo \u2014 presiona COMENZAR';
  statusEl.className = 'status-bar detected';
  if (ok) playBeep(880, 0.12, 'sine', 0.3);
}

function saltarCalibracion() { finCalibracionBocha(false); }

function restartConeMarking() {
  document.getElementById('canvas-overlay').style.pointerEvents = 'all';
  startConeMarking();
}

// ═══════════════════════════════════════════════════════════════
//  DETECTION LOOP
// ═══════════════════════════════════════════════════════════════
function startDetectionLoop() {
  if (animFrame) cancelAnimationFrame(animFrame);

  var lastBallPos = null;
  var lastBallSize = null;
  var inferring = false;
  var lastInferenceTime = 0;
  var ballHistory = [];
  var DETECTION_INTERVAL_MS = 83;

  var modelCanvas = document.createElement('canvas');
  var modelCtx = modelCanvas.getContext('2d');
  var mW = window.IS_LOW_END ? 224 : 320;
  var mH = window.IS_LOW_END ? 168 : 240;
  modelCanvas.width = mW; modelCanvas.height = mH;

  // Color tracker
  var USE_COLOR_TRACKER = sessionStorage.getItem('USE_COLOR_TRACKER') !== 'false';
  var trackCanvas = document.createElement('canvas');
  trackCanvas.width = 64; trackCanvas.height = 64;
  var trackCtx = trackCanvas.getContext('2d', { willReadFrequently: true });
  var _ballColorRef = null;

  function _sampleBallColor(det) {
    try {
      var w2 = Math.max(6, det.w * 0.5), h2 = Math.max(6, det.h * 0.5);
      trackCtx.drawImage(videoEl, det.x - w2/2, det.y - h2/2, w2, h2, 0, 0, 8, 8);
      var d = trackCtx.getImageData(0, 0, 8, 8).data;
      var r = 0, g = 0, b = 0;
      for (var i = 0; i < 64; i++) { r += d[i*4]; g += d[i*4+1]; b += d[i*4+2]; }
      var sum = r + g + b;
      if (sum < 600) return;
      var rn = r / sum, gn = g / sum;
      _ballColorRef = _ballColorRef
        ? { rn: _ballColorRef.rn * 0.7 + rn * 0.3, gn: _ballColorRef.gn * 0.7 + gn * 0.3 }
        : { rn: rn, gn: gn };
    } catch(e) {}
  }

  function _colorTrackStep(vW, vH) {
    var size = Math.max(140, (lastBallSize || 30) * 5);
    var sx = Math.min(Math.max(lastBallPos.x - size/2, 0), Math.max(0, vW - size));
    var sy = Math.min(Math.max(lastBallPos.y - size/2, 0), Math.max(0, vH - size));
    var TS = 64;
    try {
      trackCtx.drawImage(videoEl, sx, sy, size, size, 0, 0, TS, TS);
      var d = trackCtx.getImageData(0, 0, TS, TS).data;
      var sumX = 0, sumY = 0, count = 0;
      for (var i = 0; i < TS * TS; i++) {
        var r = d[i*4], g = d[i*4+1], b = d[i*4+2], s = r + g + b;
        if (s < 90) continue;
        var dr = r/s - _ballColorRef.rn, dg = g/s - _ballColorRef.gn;
        if (dr*dr + dg*dg < 0.0022) { sumX += i % TS; sumY += (i/TS)|0; count++; }
      }
      if (count < 6 || count > TS*TS*0.35) return null;
      var cx = sx + (sumX/count + 0.5) * (size/TS);
      var cy = sy + (sumY/count + 0.5) * (size/TS);
      var ddx = cx - lastBallPos.x, ddy = cy - lastBallPos.y, maxJ = size * 0.45;
      if (ddx*ddx + ddy*ddy > maxJ*maxJ) return null;
      return { x: cx, y: cy };
    } catch(e) { return null; }
  }

  function _calibStep(vW, vH) {
    var c = window._calibBocha;
    var r = Math.max(30, Math.min(vW, vH) * 0.10);
    try {
      trackCtx.drawImage(videoEl, vW/2 - r, vH/2 - r, r*2, r*2, 0, 0, 16, 16);
      var d = trackCtx.getImageData(4, 4, 8, 8).data;
      var R = 0, G = 0, B = 0;
      for (var i = 0; i < 64; i++) { R += d[i*4]; G += d[i*4+1]; B += d[i*4+2]; }
      var sum = R + G + B;
      if (sum >= 600) {
        var rn = R/sum, gn = G/sum;
        if (!(gn - rn > 0.06)) c.muestras.push({ rn: rn, gn: gn });
      }
    } catch(e) {}
    if (c.muestras.length > 40) c.muestras.shift();

    var t = Date.now() - c.inicio;
    if (c.muestras.length >= 18 && t > 1200) {
      var ms = c.muestras.slice(-18);
      var mrn = ms.reduce(function(a, m) { return a + m.rn; }, 0) / ms.length;
      var mgn = ms.reduce(function(a, m) { return a + m.gn; }, 0) / ms.length;
      var maxDev = Math.max.apply(null, ms.map(function(m) { return Math.hypot(m.rn - mrn, m.gn - mgn); }));
      if (maxDev < 0.035) {
        _ballColorRef = { rn: mrn, gn: mgn };
        lastBallPos = { x: vW/2, y: vH/2 };
        lastBallSize = Math.round(r * 0.9);
        console.log('[CALIB] Bocha calibrada');
        finCalibracionBocha(true);
        return;
      }
    }
    if (t > 6000 && t % 2000 < 40) {
      document.getElementById('status-bar').textContent = '\uD83C\uDFAF Acerca la bocha al centro del circulo';
    }
  }

  async function _runCocoSsdInference() {
    modelCtx.drawImage(videoEl, 0, 0, mW, mH);
    var predictions = await cocoModel.detect(modelCanvas, 10, 0.15);
    var scaleX = videoEl.videoWidth / mW;
    var scaleY = videoEl.videoHeight / mH;
    predictions.forEach(function(p) { p.bbox[0] *= scaleX; p.bbox[1] *= scaleY; p.bbox[2] *= scaleX; p.bbox[3] *= scaleY; });
    return predictions.filter(function(p) {
      if (p.class !== 'sports ball') return false;
      var w = p.bbox[2], h = p.bbox[3], aspect = w/h;
      if (aspect < 0.6 || aspect > 1.6) return false;
      if (w < 8 || h < 8) return false;
      if (w > videoEl.videoWidth * 0.3 || h > videoEl.videoHeight * 0.3) return false;
      return true;
    });
  }

  async function runInference() {
    if (inferring || !cocoModel || !videoEl || videoEl.readyState < 2) return;
    inferring = true;
    try { lastDetections = await _runCocoSsdInference(); }
    catch(e) { console.error('[COCOSD] Error:', e); }
    inferring = false;
  }

  function loop() {
    animFrame = requestAnimationFrame(loop);
    if (document.hidden) return;
    if (window.innerHeight > window.innerWidth) return;
    if (!videoEl || videoEl.readyState < 2 || !overlayCanvas || overlayCanvas.width === 0) return;

    var vW = videoEl.videoWidth, vH = videoEl.videoHeight;

    // Ball calibration
    if (window._calibBocha && window._calibBocha.activa) {
      _calibStep(vW, vH);
      overlayCtx.clearRect(0, 0, vW, vH);
      drawCones(vW, vH);
      var cr = Math.max(30, Math.min(vW, vH) * 0.10);
      overlayCtx.beginPath();
      overlayCtx.arc(vW/2, vH/2, cr, 0, Math.PI*2);
      overlayCtx.strokeStyle = '#FFD600';
      overlayCtx.lineWidth = 3;
      overlayCtx.setLineDash([8, 6]);
      overlayCtx.stroke();
      overlayCtx.setLineDash([]);
      return;
    }

    // Throttled inference
    var now = Date.now();
    if (now - lastInferenceTime >= DETECTION_INTERVAL_MS) {
      lastInferenceTime = now;
      runInference();
    }

    // Pick best ball
    var detected = null;
    if (lastDetections.length > 0) {
      var candidates = lastDetections.map(function(det) {
        var cx = det.bbox[0] + det.bbox[2]/2, cy = det.bbox[1] + det.bbox[3]/2;
        var score = det.score;
        if (lastBallPos) {
          var dist = Math.sqrt(Math.pow(cx - lastBallPos.x, 2) + Math.pow(cy - lastBallPos.y, 2));
          var frameMax = Math.max(vW, vH);
          score += Math.max(0, 1 - dist/(frameMax*0.5)) * 0.5;
          if (dist > frameMax * 0.4) score -= 0.6;
          if (lastBallSize) {
            var ratio = Math.max(det.bbox[2], det.bbox[3]) / lastBallSize;
            if (ratio > 2.5 || ratio < 0.4) score -= 0.3;
          }
        }
        return { det: det, score: score };
      });
      candidates.sort(function(a, b) { return b.score - a.score; });
      var best = candidates[0].det;
      detected = {
        x: best.bbox[0] + best.bbox[2]/2, y: best.bbox[1] + best.bbox[3]/2,
        w: best.bbox[2], h: best.bbox[3], score: best.score, fromModel: true
      };
      lastDetections = [];
      _sampleBallColor(detected);
    }

    // Color tracker between inferences
    if (!detected && USE_COLOR_TRACKER && _ballColorRef && lastBallPos) {
      var ct = _colorTrackStep(vW, vH);
      if (ct) detected = { x: ct.x, y: ct.y, w: lastBallSize || 26, h: lastBallSize || 26, score: 0.45, tracked: true };
    }

    // Trajectory prediction
    if (detected) {
      ballHistory.push({ x: detected.x, y: detected.y, t: Date.now() });
      if (ballHistory.length > 5) ballHistory.shift();
    } else if (ballHistory.length >= 2 && challengeActive) {
      var now2 = Date.now(), n = ballHistory.length, latest = ballHistory[n-1];
      var elapsed = now2 - latest.t;
      if (elapsed < 450) {
        var px, py;
        if (n >= 3) {
          var p0 = ballHistory[n-3], p1 = ballHistory[n-2], p2 = ballHistory[n-1];
          var dt01 = Math.max(1, p1.t - p0.t), dt12 = Math.max(1, p2.t - p1.t);
          var vx1 = (p1.x-p0.x)/dt01, vy1 = (p1.y-p0.y)/dt01;
          var vx2 = (p2.x-p1.x)/dt12, vy2 = (p2.y-p1.y)/dt12;
          var totalDt = Math.max(1, p2.t - p0.t);
          var ax = (vx2-vx1)/totalDt, ay = (vy2-vy1)/totalDt;
          px = p2.x + vx2*elapsed + 0.5*ax*elapsed*elapsed;
          py = p2.y + vy2*elapsed + 0.5*ay*elapsed*elapsed;
        } else {
          var a2 = ballHistory[n-2], b2 = ballHistory[n-1];
          var dt = Math.max(1, b2.t - a2.t);
          px = b2.x + ((b2.x - a2.x)/dt)*elapsed;
          py = b2.y + ((b2.y - a2.y)/dt)*elapsed;
        }
        detected = { x: px, y: py, w: lastBallSize||30, h: lastBallSize||30, score: 0.5, predicted: true };
      }
    }

    var smoothBall = trackerUpdate(detected);
    if (detected && !detected.predicted) {
      lastDetectedTime = Date.now();
      lastBallPos = { x: detected.x, y: detected.y };
      lastBallSize = Math.max(detected.w, detected.h);
    }

    // Analytics: lost intervals
    if (challengeActive) {
      if (detected && !detected.predicted) {
        lastRealDetectionMs = Date.now();
        if (currentLostStart !== null) {
          var lostEnd = +((Date.now() - challengeStartMs) / 1000).toFixed(1);
          if (lostEnd - currentLostStart >= 0.3) lostIntervals.push({ start: currentLostStart, end: lostEnd });
          currentLostStart = null;
        }
      } else if (currentLostStart === null && Date.now() - lastRealDetectionMs > 300) {
        currentLostStart = +((lastRealDetectionMs - challengeStartMs) / 1000).toFixed(1);
      }
    }

    // Draw overlay
    overlayCtx.clearRect(0, 0, vW, vH);
    drawCones(vW, vH);

    if (smoothBall) {
      positions.push({ x: smoothBall.x, y: smoothBall.y });
      if (positions.length > MAX_TRAIL) positions.shift();

      // Analytics: trajectory log every 100ms
      if (challengeActive && coneA && coneB && now - lastTrajectoryLogTime >= 100) {
        lastTrajectoryLogTime = now;
        var cdx = coneB.x - coneA.x, cdy = coneB.y - coneA.y;
        var cdist2 = cdx * cdx + cdy * cdy || 1;
        var bx = smoothBall.x - coneA.x, by = smoothBall.y - coneA.y;
        var nx = (bx * cdx + by * cdy) / cdist2;
        var ny = (-bx * cdy + by * cdx) / cdist2;
        trajectoryLog.push({
          t: +((now - challengeStartMs) / 1000).toFixed(1),
          x: +nx.toFixed(3), y: +ny.toFixed(3),
          p: detected && detected.predicted ? 1 : 0
        });
      }

      // Trail
      if (positions.length >= 2) {
        var pts = [positions[0]];
        for (var pi = 1; pi < positions.length; pi++) {
          var prv = pts[pts.length-1];
          var ddx2 = positions[pi].x - prv.x, ddy2 = positions[pi].y - prv.y;
          if (Math.sqrt(ddx2*ddx2+ddy2*ddy2) >= 3) pts.push(positions[pi]);
        }
        for (var ti = 1; ti < pts.length; ti++) {
          var alpha = ti / pts.length;
          overlayCtx.beginPath();
          if (ti === 1) { overlayCtx.moveTo(pts[0].x, pts[0].y); }
          else { overlayCtx.moveTo((pts[ti-2].x+pts[ti-1].x)/2, (pts[ti-2].y+pts[ti-1].y)/2); }
          overlayCtx.quadraticCurveTo(pts[ti-1].x, pts[ti-1].y, (pts[ti-1].x+pts[ti].x)/2, (pts[ti-1].y+pts[ti].y)/2);
          overlayCtx.strokeStyle = 'rgba(255,214,0,' + (alpha*0.9) + ')';
          overlayCtx.lineWidth = 2 + alpha*4;
          overlayCtx.lineCap = 'round';
          overlayCtx.lineJoin = 'round';
          overlayCtx.stroke();
        }
      }

      var radius = detected ? Math.max(20, Math.max(detected.w, detected.h)/2 + 8) : 24;
      overlayCtx.beginPath();
      overlayCtx.arc(smoothBall.x, smoothBall.y, radius, 0, Math.PI*2);
      overlayCtx.strokeStyle = '#FFD600';
      overlayCtx.lineWidth = 4;
      overlayCtx.stroke();
      overlayCtx.beginPath();
      overlayCtx.arc(smoothBall.x, smoothBall.y, 8, 0, Math.PI*2);
      overlayCtx.fillStyle = 'rgba(255,214,0,0.55)';
      overlayCtx.fill();

      if (!challengeActive && conesMarked && !window._calibBocha.activa) {
        document.getElementById('status-bar').textContent = '\u2705 Todo listo \u2014 presiona COMENZAR';
        document.getElementById('status-bar').className = 'status-bar detected';
      } else if (challengeActive) {
        detectEight({ x: smoothBall.x, y: smoothBall.y });
      }
    } else {
      positions = [];
      if (!challengeActive && conesMarked && !window._calibBocha.activa && Date.now() - lastDetectedTime > 2000) {
        document.getElementById('status-bar').textContent = '\uD83D\uDD0D Mostra la bocha a la camara...';
        document.getElementById('status-bar').className = 'status-bar';
      }
    }
  }

  loop();
}

// ═══════════════════════════════════════════════════════════════
//  CHALLENGE FLOW
// ═══════════════════════════════════════════════════════════════
async function startTestChallenge() {
  if (!selectedTest) return;

  goTo('screen-challenge');
  checkOrientation();

  // Reset
  eightCount = 0;
  timeLeft = selectedTest.duration;
  challengeActive = false;
  positions = [];
  coneA = null; coneB = null; conesMarked = false; coneMarkingStep = 0;
  resetEightState();
  trackerReset();
  lastDetections = [];
  window._calibBocha = { activa: false, hecha: false, muestras: [], inicio: 0 };

  document.getElementById('hud-counter').textContent = '0';
  document.getElementById('hud-timer').textContent = timeLeft;
  document.getElementById('hud-timer').className = 'hud-timer';
  document.getElementById('status-bar').textContent = '\uD83E\uDDE0 Cargando camara e IA...';
  document.getElementById('status-bar').className = 'status-bar';
  document.getElementById('btn-start-challenge').style.display = 'none';
  document.getElementById('btn-remark-cones').style.display = 'none';
  document.getElementById('btn-skip-calib').style.display = 'none';
  document.getElementById('countdown-overlay').style.display = 'none';

  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  var modelPromise = _loadCocoSsd();

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: window.IS_LOW_END ? 640 : 1280 },
        height: { ideal: window.IS_LOW_END ? 480 : 720 }
      },
      audio: false
    });
    videoEl = document.getElementById('video');
    videoEl.srcObject = stream;
    videoEl.onloadedmetadata = function() { videoEl.play().catch(function() {}); };

    var waitForVideo = setInterval(async function() {
      if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
        clearInterval(waitForVideo);
        overlayCanvas = document.getElementById('canvas-overlay');
        overlayCtx = overlayCanvas.getContext('2d');
        overlayCanvas.width = videoEl.videoWidth;
        overlayCanvas.height = videoEl.videoHeight;
        updateCanvasDimensions();
        await modelPromise;
        startConeMarking();
        startDetectionLoop();
      }
    }, 200);
  } catch(e) {
    document.getElementById('status-bar').textContent = '\u274C Sin acceso a camara \u2014 verifica los permisos';
    console.error('Camera error:', e);
  }
}

function startCountdown() {
  var overlay = document.getElementById('countdown-overlay');
  var numEl = document.getElementById('countdown-num');
  overlay.style.display = 'flex';
  document.getElementById('btn-start-challenge').style.display = 'none';
  document.getElementById('btn-remark-cones').style.display = 'none';

  var count = 3;
  numEl.textContent = count;
  playBeep(440, 0.15);

  var ci = setInterval(function() {
    count--;
    if (count > 0) {
      numEl.textContent = count;
      playBeep(440, 0.15);
    } else {
      overlay.style.display = 'none';
      clearInterval(ci);
      challengeActive = true;
      challengeStartMs = Date.now();
      ochosTimestamps = []; crucesTimestamps = []; trajectoryLog = [];
      lostIntervals = []; lastRealDetectionMs = challengeStartMs; currentLostStart = null;
      datosCalc = null;
      startChallengeTimer();
      playBeep(880, 0.2, 'sine', 0.5);
      document.getElementById('status-bar').textContent = '\uD83C\uDFD1 \u00A1Dale, hace ochos!';
      document.getElementById('status-bar').className = 'status-bar detected';
    }
  }, 1000);
}

function startChallengeTimer() {
  timeLeft = selectedTest.duration;
  document.getElementById('hud-timer').textContent = timeLeft;

  timerInterval = setInterval(function() {
    timeLeft--;
    document.getElementById('hud-timer').textContent = timeLeft;
    if (timeLeft <= 10 && timeLeft > 5) {
      document.getElementById('hud-timer').className = 'hud-timer warning';
      playWarningBeep();
    } else if (timeLeft <= 5 && timeLeft > 0) {
      document.getElementById('hud-timer').className = 'hud-timer urgent';
      playUrgentBeep();
    }
    if (timeLeft <= 0) endChallenge();
  }, 1000);
}

function endChallenge() {
  challengeActive = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  // Close open lost interval
  if (currentLostStart !== null) {
    var endSec = selectedTest ? selectedTest.duration : 60;
    if (endSec - currentLostStart >= 0.3) lostIntervals.push({ start: currentLostStart, end: +endSec.toFixed(1) });
    currentLostStart = null;
  }

  // Build analytics payload
  datosCalc = {
    ochos_t: ochosTimestamps,
    cruces_t: crucesTimestamps,
    tray: trajectoryLog,
    perdidas: lostIntervals,
    conos: coneA && coneB ? { a: { x: +coneA.x.toFixed(1), y: +coneA.y.toFixed(1) }, b: { x: +coneB.x.toFixed(1), y: +coneB.y.toFixed(1) } } : null,
    video: videoEl ? { w: videoEl.videoWidth, h: videoEl.videoHeight } : null
  };

  resultadoIA = eightCount;
  resultadoPrincipal = eightCount;
  corregido = false;
  playBeep(440, 0.3, 'sine', 0.5);
  setTimeout(function() { playBeep(330, 0.4, 'sine', 0.4); }, 300);
  stopCamera();
  goTo('screen-result');
  renderResult();
}

function abortChallenge() {
  challengeActive = false;
  stopCamera();
  goTo('screen-tests');
}

// ═══════════════════════════════════════════════════════════════
//  RESULT & SAVE
// ═══════════════════════════════════════════════════════════════
function renderResult() {
  document.getElementById('result-test-name').textContent =
    selectedTest ? selectedTest.code + ' \u2014 ' + selectedTest.name + ': ' + selectedTest.sub : '';
  document.getElementById('result-player').textContent =
    currentPlayer ? currentPlayer.nombre + ' ' + currentPlayer.apellido : '';
  document.getElementById('result-duration').textContent = selectedTest ? selectedTest.duration : 60;
  document.getElementById('result-count').textContent = resultadoIA;
  document.getElementById('result-final').textContent = resultadoPrincipal;
  document.getElementById('result-corrected').style.display = 'none';
  renderMetrics(datosCalc);
}

function correctResult(delta) {
  resultadoPrincipal = Math.max(0, resultadoPrincipal + delta);
  document.getElementById('result-final').textContent = resultadoPrincipal;
  corregido = resultadoPrincipal !== resultadoIA;
  document.getElementById('result-corrected').style.display = corregido ? 'block' : 'none';
}

// ═══════════════════════════════════════════════════════════════
//  METRICS COMPUTATION
// ═══════════════════════════════════════════════════════════════
function computeMetrics(dc) {
  if (!dc || !dc.ochos_t || dc.ochos_t.length < 2) return null;
  var ot = dc.ochos_t, ct = dc.cruces_t || [], perdidas = dc.perdidas || [];

  // C1: Ritmo por tramo
  var tramos = [0, 0, 0, 0];
  ot.forEach(function(t) { tramos[Math.min(3, (t / 15) | 0)]++; });
  var caida = tramos[0] > 0 ? Math.round((1 - tramos[3] / tramos[0]) * 100) : null;

  // C2: Regularidad
  var intervals = [];
  for (var i = 1; i < ot.length; i++) intervals.push(ot[i] - ot[i - 1]);
  var mean = intervals.reduce(function(a, b) { return a + b; }, 0) / intervals.length;
  var variance = intervals.reduce(function(a, b) { return a + (b - mean) * (b - mean); }, 0) / intervals.length;
  var std = Math.sqrt(variance);
  var cv = mean > 0 ? std / mean : 0;
  var regularidad = Math.round(Math.max(0, Math.min(100, 100 * (1 - cv))));

  // C3: Desconcentraciones
  var sortedInt = intervals.slice().sort(function(a, b) { return a - b; });
  var mediana = sortedInt[Math.floor(sortedInt.length / 2)];
  var umbral = mediana * 1.6;
  var desconc = [];
  for (var j = 0; j < intervals.length; j++) {
    if (intervals[j] > umbral) {
      var tOcho = ot[j + 1];
      var enPerdida = perdidas.some(function(p) { return tOcho >= p.start && ot[j] <= p.end; });
      desconc.push({ ocho: j + 2, segundo: tOcho, sinDatos: enPerdida });
    }
  }

  // C4: Simetría
  var simetria = null;
  if (ct.length >= 4) {
    var leftHalves = [], rightHalves = [];
    for (var k = 0; k + 1 < ct.length; k++) {
      var dur = ct[k + 1].t - ct[k].t;
      if (dur <= 0) continue;
      var toSide = ct[k].side;
      if (toSide === 'left') leftHalves.push(dur);
      else if (toSide === 'right') rightHalves.push(dur);
    }
    if (leftHalves.length > 0 && rightHalves.length > 0) {
      var avgL = leftHalves.reduce(function(a, b) { return a + b; }, 0) / leftHalves.length;
      var avgR = rightHalves.reduce(function(a, b) { return a + b; }, 0) / rightHalves.length;
      var maxAvg = Math.max(avgL, avgR);
      simetria = {
        pctDiff: maxAvg > 0 ? Math.round(Math.abs(avgL - avgR) / maxAvg * 100) : 0,
        ladoLento: avgL > avgR ? 'izquierda' : avgR > avgL ? 'derecha' : null,
        avgL: +avgL.toFixed(2), avgR: +avgR.toFixed(2)
      };
    }
  }

  return { tramos: tramos, caida: caida, regularidad: regularidad, desconc: desconc, simetria: simetria, mediana: +mediana.toFixed(2) };
}

function renderMetrics(dc) {
  var el = document.getElementById('result-metrics');
  if (!el) return;
  var m = computeMetrics(dc);
  if (!m) { el.innerHTML = ''; return; }

  var html = '';

  // C1: Ritmo
  var maxTramo = Math.max.apply(null, m.tramos) || 1;
  html += '<div class="metric-section"><div class="metric-title">RITMO POR TRAMO</div><div class="metric-card">';
  var tramoLabels = ['0-15s', '15-30s', '30-45s', '45-60s'];
  for (var i = 0; i < 4; i++) {
    var pct = Math.round(m.tramos[i] / maxTramo * 100);
    html += '<div class="metric-row" style="margin-bottom:4px"><span class="metric-label">' + tramoLabels[i] + '</span><span class="metric-label" style="color:#F5F5F5">' + m.tramos[i] + '</span></div>';
    html += '<div class="metric-bar-bg"><div class="metric-bar" style="width:' + pct + '%;background:' + (i === 3 && m.caida > 30 ? '#E63946' : '#FFD600') + '"></div></div>';
  }
  if (m.caida !== null) {
    var caidaColor = m.caida > 30 ? '#E63946' : m.caida > 15 ? '#F4A261' : '#2A9D8F';
    html += '<div class="metric-row" style="margin-top:8px"><span class="metric-label">CAIDA DE RITMO</span><span class="metric-value" style="font-size:18px;color:' + caidaColor + '">' + m.caida + '%</span></div>';
  }
  html += '</div></div>';

  // C2: Regularidad
  var regColor = m.regularidad >= 70 ? '#2A9D8F' : m.regularidad >= 40 ? '#F4A261' : '#E63946';
  html += '<div class="metric-section"><div class="metric-title">REGULARIDAD</div><div class="metric-card">';
  html += '<div class="metric-row"><span class="metric-label">CONSTANCIA</span><span class="metric-value" style="color:' + regColor + '">' + m.regularidad + '<span style="font-size:14px">/100</span></span></div>';
  html += '<div class="metric-bar-bg"><div class="metric-bar" style="width:' + m.regularidad + '%;background:' + regColor + '"></div></div>';
  html += '<div class="metric-note">Mediana entre ochos: ' + m.mediana + 's</div>';
  html += '</div></div>';

  // C3: Desconcentraciones
  if (m.desconc.length > 0) {
    html += '<div class="metric-section"><div class="metric-title">DESCONCENTRACIONES</div><div class="metric-card">';
    m.desconc.forEach(function(d) {
      if (d.sinDatos) {
        html += '<div class="metric-note" style="margin-bottom:4px">Ocho #' + d.ocho + ' (seg ' + d.segundo + ') \u2014 sin datos (la IA perdi\u00F3 la bocha)</div>';
      } else {
        html += '<div class="metric-note metric-warn" style="margin-bottom:4px">Ocho #' + d.ocho + ' (seg ' + d.segundo + ') \u2014 lento</div>';
      }
    });
    html += '</div></div>';
  }

  // C4: Simetría
  if (m.simetria) {
    var simColor = m.simetria.pctDiff <= 10 ? '#2A9D8F' : m.simetria.pctDiff <= 25 ? '#F4A261' : '#E63946';
    html += '<div class="metric-section"><div class="metric-title">SIMETRIA</div><div class="metric-card">';
    if (m.simetria.pctDiff <= 5) {
      html += '<div class="metric-row"><span class="metric-label">EQUILIBRADO</span><span class="metric-value" style="font-size:18px;color:#2A9D8F">\u2714</span></div>';
    } else {
      html += '<div class="metric-row"><span class="metric-label">' + m.simetria.ladoLento.toUpperCase() + ' MAS LENTA</span><span class="metric-value" style="font-size:18px;color:' + simColor + '">+' + m.simetria.pctDiff + '%</span></div>';
    }
    html += '<div class="metric-note">Izq: ' + m.simetria.avgL + 's \u00B7 Der: ' + m.simetria.avgR + 's (promedio por mitad)</div>';
    html += '</div></div>';
  }

  // C5: Recorrido (trayectoria)
  if (dc.tray && dc.tray.length > 10) {
    html += '<div class="metric-section"><div class="metric-title">RECORRIDO</div>';
    html += '<div class="metric-card" style="padding:8px">';
    html += '<canvas id="canvas-trayectoria" width="360" height="220" style="width:100%;border-radius:8px"></canvas>';
    html += '<div style="display:flex;justify-content:center;gap:12px;margin-top:6px">';
    html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:14px;height:3px;background:#FFD600;border-radius:1px"></span><span class="metric-label" style="font-size:9px">0-15</span></span>';
    html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:14px;height:3px;background:#F4A261;border-radius:1px"></span><span class="metric-label" style="font-size:9px">15-30</span></span>';
    html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:14px;height:3px;background:#E63946;border-radius:1px"></span><span class="metric-label" style="font-size:9px">30-45</span></span>';
    html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:14px;height:3px;background:#457B9D;border-radius:1px"></span><span class="metric-label" style="font-size:9px">45-60</span></span>';
    html += '</div>';
    html += '<div style="text-align:center;margin-top:8px"><button id="btn-play-tray" class="btn-ghost" style="font-size:12px;padding:6px 18px" onclick="toggleTrayPlayback(\'canvas-trayectoria\')">&#9654; REPRODUCIR x1</button></div>';
    html += '</div></div>';
  }

  el.innerHTML = html;

  // Draw trajectory after DOM update
  if (dc.tray && dc.tray.length > 10) {
    setTimeout(function() { drawTrajectory('canvas-trayectoria', dc, m); }, 50);
  }
}

var TRAY_COLORS = ['#FFD600', '#F4A261', '#E63946', '#457B9D'];

function tramoColor(t) {
  var idx = Math.min(3, (t / 15) | 0);
  return TRAY_COLORS[idx];
}

function isInLost(t, perdidas) {
  for (var i = 0; i < perdidas.length; i++) {
    if (t >= perdidas[i].start && t <= perdidas[i].end) return true;
  }
  return false;
}

function drawTrajectoryFrame(canvasId, dc, metrics, upToTime) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(0, 0, W, H);

  var xMin = -0.3, xMax = 1.3, yMin = -0.6, yMax = 0.6;
  function mapX(nx) { return ((nx - xMin) / (xMax - xMin)) * W; }
  function mapY(ny) { return ((ny - yMin) / (yMax - yMin)) * H; }

  // Center line
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(mapX(0.5), 0);
  ctx.lineTo(mapX(0.5), H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Cones
  var coneR = 10;
  ctx.beginPath(); ctx.arc(mapX(0), mapY(0), coneR, 0, Math.PI * 2);
  ctx.fillStyle = '#E63946'; ctx.fill();
  ctx.beginPath(); ctx.arc(mapX(1), mapY(0), coneR, 0, Math.PI * 2);
  ctx.fillStyle = '#E63946'; ctx.fill();
  ctx.font = '10px "Barlow Condensed"';
  ctx.fillStyle = '#aaa'; ctx.textAlign = 'center';
  ctx.fillText('A', mapX(0), mapY(0) + coneR + 12);
  ctx.fillText('B', mapX(1), mapY(0) + coneR + 12);

  var tray = dc.tray;
  var perdidas = dc.perdidas || [];
  var maxT = upToTime !== undefined ? upToTime : Infinity;

  // Draw trajectory with segment colors + dashed gray for lost
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var i = 1; i < tray.length; i++) {
    if (tray[i].t > maxT) break;
    var lost = isInLost(tray[i].t, perdidas);
    if (lost) {
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(100,100,100,0.5)';
    } else {
      ctx.setLineDash([]);
      ctx.strokeStyle = tramoColor(tray[i].t);
    }
    ctx.beginPath();
    ctx.moveTo(mapX(tray[i - 1].x), mapY(tray[i - 1].y));
    ctx.lineTo(mapX(tray[i].x), mapY(tray[i].y));
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Red dots at genuine deconcentrations
  if (metrics && metrics.desconc) {
    metrics.desconc.forEach(function(d) {
      if (d.sinDatos) return; // skip IA-lost ones
      // Find closest tray point to the deconcentration time
      var closest = null, bestDt = Infinity;
      for (var j = 0; j < tray.length; j++) {
        if (tray[j].t > maxT) break;
        var dt = Math.abs(tray[j].t - d.segundo);
        if (dt < bestDt) { bestDt = dt; closest = tray[j]; }
      }
      if (closest) {
        ctx.beginPath();
        ctx.arc(mapX(closest.x), mapY(closest.y), 5, 0, Math.PI * 2);
        ctx.fillStyle = '#E63946';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(mapX(closest.x), mapY(closest.y), 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    });
  }

  // Ball cursor during playback
  if (upToTime !== undefined && upToTime < Infinity) {
    var last = null;
    for (var k = 0; k < tray.length; k++) {
      if (tray[k].t <= maxT) last = tray[k]; else break;
    }
    if (last) {
      ctx.beginPath();
      ctx.arc(mapX(last.x), mapY(last.y), 6, 0, Math.PI * 2);
      ctx.fillStyle = '#FFD600';
      ctx.fill();
    }
  }
}

function drawTrajectory(canvasId, dc, metrics) {
  drawTrajectoryFrame(canvasId, dc, metrics, Infinity);
}

// Playback state
var trayPlayback = { active: false, speed: 1, animId: null, canvasId: null, dc: null, metrics: null, startReal: 0, pausedAt: 0 };

function toggleTrayPlayback(canvasId) {
  var btn = document.getElementById('btn-play-tray');
  if (trayPlayback.active) {
    // Stop
    if (trayPlayback.animId) cancelAnimationFrame(trayPlayback.animId);
    trayPlayback.active = false;
    if (btn) btn.innerHTML = '&#9654; REPRODUCIR x' + trayPlayback.speed;
    drawTrajectory(canvasId, trayPlayback.dc, trayPlayback.metrics);
    return;
  }

  // Start or change speed
  if (!datosCalc || !datosCalc.tray || datosCalc.tray.length < 10) return;
  trayPlayback.canvasId = canvasId;
  trayPlayback.dc = datosCalc;
  trayPlayback.metrics = computeMetrics(datosCalc);
  trayPlayback.speed = trayPlayback.speed === 1 ? 2 : 1;
  trayPlayback.active = true;
  trayPlayback.startReal = performance.now();
  trayPlayback.pausedAt = 0;
  if (btn) btn.innerHTML = '&#9632; x' + trayPlayback.speed;

  // Counter overlay
  var counterEl = document.getElementById('result-final');
  var timerEl = document.getElementById('btn-play-tray');
  var ochosT = datosCalc.ochos_t || [];

  function animLoop(now) {
    if (!trayPlayback.active) return;
    var elapsed = (now - trayPlayback.startReal) / 1000 * trayPlayback.speed;
    var duration = selectedTest ? selectedTest.duration : 60;
    if (elapsed >= duration) {
      trayPlayback.active = false;
      if (btn) btn.innerHTML = '&#9654; REPRODUCIR x' + trayPlayback.speed;
      drawTrajectory(canvasId, trayPlayback.dc, trayPlayback.metrics);
      return;
    }

    drawTrajectoryFrame(canvasId, trayPlayback.dc, trayPlayback.metrics, elapsed);

    // Update timer and counter in button
    var currentCount = 0;
    for (var i = 0; i < ochosT.length; i++) { if (ochosT[i] <= elapsed) currentCount++; }
    var secsLeft = Math.ceil(duration - elapsed);
    if (btn) btn.innerHTML = '&#9632; ' + secsLeft + 's \u00B7 ' + currentCount + ' ochos \u00B7 x' + trayPlayback.speed;

    trayPlayback.animId = requestAnimationFrame(animLoop);
  }
  trayPlayback.animId = requestAnimationFrame(animLoop);
}

async function saveEvaluacion() {
  if (!currentPlayer || !selectedTest) return;
  var res = await sb.from('evaluaciones').insert({
    ficha_id: currentPlayer.id,
    coach_id: currentUser.id,
    equipo_id: currentTeam ? currentTeam.id : null,
    tipo_test: selectedTest.id,
    duracion_segundos: selectedTest.duration,
    resultado_principal: resultadoPrincipal,
    resultado_ia: resultadoIA,
    corregido: corregido,
    estado: 'valido',
    datos_calculados: datosCalc
  });
  if (res.error) { showToast('Error al guardar: ' + res.error.message); return; }
  showToast('Resultado guardado');
  goTo('screen-player');
}

function discardResult() { goTo('screen-tests'); }
